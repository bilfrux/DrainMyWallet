<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="DrainMyWallet logo">
  <title>DrainMyWallet</title>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="180" x2="0" y2="252">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="44"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="#00120a"/>
    <rect x="3" y="3" width="250" height="250" rx="41" fill="none" stroke="#0f5c25" stroke-width="3"/>

    <!-- characters draining out of the wallet -->
    <g stroke="url(#fade)" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 12" fill="none">
      <line x1="82"  y1="176" x2="82"  y2="252"/>
      <line x1="128" y1="176" x2="128" y2="252" stroke-dasharray="10 14"/>
      <line x1="174" y1="176" x2="174" y2="252" stroke-dasharray="16 11"/>
    </g>

    <g filter="url(#glow)" stroke="#00ff41" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- wallet body and flap -->
      <rect x="36" y="64" width="184" height="112" rx="14" fill="#00120a" stroke-width="9"/>
      <path d="M36 92h184" stroke-width="6" opacity="0.55"/>
      <!-- clasp -->
      <rect x="164" y="112" width="56" height="36" rx="10" fill="#00120a" stroke-width="7"/>
      <circle cx="184" cy="130" r="5" fill="#00ff41" stroke="none"/>
      <!-- prompt >_ -->
      <path d="M62 118l24 14-24 14" stroke-width="9"/>
      <path d="M98 150h28" stroke-width="9"/>
    </g>
  </g>
</svg>
